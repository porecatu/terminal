[package]
name = "porecatu-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
portable-pty = "0.9.0"
# ADR-0033 (varredura da árvore), ADR-0038 (`cwd` em Linux/macOS) e ADR-0093
# (amostragem do gerenciador de tarefas): `sysinfo` compila nas três
# plataformas e é dependência comum, com a feature mínima `system`.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
win32job = "2.0.3"
