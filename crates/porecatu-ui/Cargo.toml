[package]
name = "porecatu-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Árvore de acessibilidade sobre o chrome (ADR-0043): adaptador escolhido
# pela versão do `winit` já pinado, não o contrário -- mesma disciplina do
# `wgpu` (F0). `accesskit_winit 0.34` resolve contra o mesmo `winit
# 0.30.13` do projeto, sem duplicar `winit` na árvore (conferido com
# `cargo tree -p porecatu-ui -i winit`). MIT OR Apache-2.0 (`accesskit`) e
# Apache-2.0 (`accesskit_winit`), compatíveis com GPLv3.
accesskit = "0.25"
accesskit_winit = "0.34"
arboard = "3"
dirs = "5"
notify = "8.2.0"
# Abre/revela hyperlinks OSC 8 (ADR-0042 §6): `unsafe` da chamada de
# plataforma (ShellExecuteW/xdg-open/open) fica dentro do crate, como
# arboard/portable-pty/png/win32job já fazem. MIT OR Apache-2.0, compatível
# com GPLv3. `reveal` é a operação que decide `file` -- sem ela, `file`
# cairia no handler por extensão como fallback, que é exatamente o que o
# ADR proíbe.
opener = { version = "0.8", features = ["reveal"] }
png = "0.18"
porecatu-config = { path = "../porecatu-config" }
porecatu-core = { path = "../porecatu-core" }
porecatu-render = { path = "../porecatu-render" }
porecatu-session = { path = "../porecatu-session" }
porecatu-term = { path = "../porecatu-term" }
winit = "0.30.13"
