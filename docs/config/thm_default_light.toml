# Tema "default_light" -- o tema claro padrão do Porecatu.
#
# Um tema é um arquivo thm_<nome>.toml na mesma pasta do porecatu.toml.
# Para criar o seu, copie este arquivo com outro nome (por exemplo,
# thm_meu.toml) e troque as cores. Chave que o seu tema não tiver usa a
# cor do tema "default". Veja as explicações em thm_default.toml.

[terminal]
foreground = "#4c4f69"
background = "#eff1f5"
cursor = "#dc8a78"
cursor_text = "#eff1f5"
selection_background = "#acb0be"
selection_foreground = "#4c4f69"
prompt_secondary = "#8c8fa1"

[terminal.normal]
black = "#5c5f77"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#acb0be"

[terminal.bright]
black = "#6c6f85"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#bcc0cc"

[window]
background = "#e6e9ef"
border = "#ccd0da"

[tabs]
bar_background = "#e6e9ef"
bar_border = "#dce0e8"
active_background = "#ccd0da"
active_foreground = "#4c4f69"
inactive_background = "#eff1f5"
inactive_foreground = "#8c8fa1"
close_button_foreground = "#5c5f77"
close_button_hover_background = "#bcc0cc"
close_button_hover_foreground = "#4c4f69"
exited_foreground = "#9ca0b0"
active_border = "#bcc0cc"
inactive_border = "#dce0e8"
selected_border = "#179299"
activity_indicator = "#40a02b"
bell_indicator = "#d20f39"
rename_background = "#eff1f5"
rename_border = "#179299"
rename_foreground = "#4c4f69"
overflow_indicator_background = "#dce0e8"

[window_controls]
