##############################################################################
# Porecatu — configuração de referência
#
# Todos os valores mostrados aqui são os DEFAULTS. Nenhuma chave é obrigatória:
# apagar este arquivo inteiro produz exatamente o mesmo comportamento.
#
# Local do arquivo:
#   Linux    $XDG_CONFIG_HOME/porecatu/porecatu.toml  (~/.config/porecatu/)
#   macOS    ~/.config/porecatu/porecatu.toml
#   Windows  %APPDATA%\porecatu\porecatu.toml
#
# Override: --config <caminho>  ou  variável PORECATU_CONFIG
#
# Recarga a quente: salvar o arquivo aplica as mudanças em menos de 500 ms.
# Config inválida NÃO derruba o app — mantém a anterior e mostra o erro.
#
# CLASSE DE RECARGA (ADR-0030). Cada seção abaixo declara a sua; onde uma
# chave foge da classe da seção, ela vem marcada na própria linha.
#   [A] aplica a quente: troca o Config, recalcula o layout, redesenha.
#   [B] aplica a quente COM recálculo de grade e resize de todos os PTYs --
#       um resize por recarga, coalescido pelo debounce.
#   [C] não aplica à sessão em curso, e AVISA o escopo real ("vale na
#       próxima janela", "vale em aba nova", "reinicie o app"). Ignorar em
#       silêncio produz "mudei e não aconteceu nada", indistinguível de bug.
# Uma chave de classe C alterada não invalida o resto da gravação.
#
# Governança de cada seção:
#   [general] [shell]        PRD-000, PRD-001; TERM em ADR-0012
#   [appearance.*]           PRD-004  (aparência do chrome)
#   [appearance.notices]     PRD-010, ADR-0014  (aviso, diálogo, menu)
#   [appearance.dialog]      PRD-010, ADR-0014
#   [appearance.context_menu] PRD-010, ADR-0014
#   [terminal.*] [[themes]]  PRD-005  (aparência do terminal)
#   [terminal.selection]     PRD-010, ADR-0013  (mouse, seleção)
#   [terminal.clipboard]     PRD-010, ADR-0013  (OSC 52)
#   [keybindings]            ADR-0008; catálogo em docs/reference/acoes.md
#   [session]                PRD-003
#
# ORIGEM DOS VALORES DE APARÊNCIA
# Cores, dimensões, raios e espaçamentos estão registrados em
# docs/design/especificacao-visual.md (seção 1, Tokens), e não são
# arbitrários. A direção da conferência mudou com o ADR-0028: o BINÁRIO é a
# referência visual, e estes defaults têm de reproduzir o que ele desenha.
# O mockup (docs/design/mockup-estatico.html) é histórico -- divergência
# entre ele e a build não é bug. Nenhuma mudança de aparência sem aval do
# dono do produto, inclusive nas chaves abaixo.
#
# O QUE NÃO É CONFIGURÁVEL, E POR QUÊ
# Vira chave o que se VÊ. Fica fixo no binário o que se SENTE -- mecânica de
# interação, não aparência: limiar de duplo/triplo clique (500 ms), limiar
# de arraste (4 px), zona de auto-scroll na borda da trilha (30 px) e passo
# dela (12 px), cascata da janela nova (30 px, ADR-0015) e intervalo de
# frame do relógio de animação. Não são tokens de design: são convenções de
# SO ou consequências do modelo de threading (ADR-0007, ADR-0022).
#
# Chaves marcadas [v2] descrevem elementos desenhados no canvas mas fora do
# escopo do v1. Estão aqui para reserva de nome; não implementar ainda.
#
# Cores aceitam "#rrggbb", "#rrggbbaa" ou "transparent".
##############################################################################


# Classe de recarga: [A] -- as três valem no próximo gesto que as consulta.
[general]
# Pede confirmação ao fechar aba com processo ativo — dois sinais em OU:
# tela alternativa/reporte de mouse ligado (vim, htop, less, fzf, tmux), ou,
# no Windows, mais de um processo vivo na árvore do shell (ADR-0033), ex. um
# `node server.js` em primeiro plano. Nenhum dos dois é a varredura contínua
# que o ADR-0005 e o ADR-0008 descartaram para decidir "processo em primeiro
# plano" — a contagem aqui é disparada só pelo clique de fechar, sobre uma
# raiz já conhecida (o shell desta aba), não uma heurística contínua.
#                                           RF-1.6, ADR-0017, ADR-0033, ADR-0034
confirm_close_with_process = true
# Pede confirmação ao fechar uma janela com mais de uma aba.      RF-10.23
confirm_close_window = true
# Diretório da primeira aba de uma sessão nova. "home" ou um caminho absoluto.
# Abas criadas depois herdam o diretório da aba ativa.  RF-1.1
startup_directory = "home"


# Classe de recarga: [C] -- "vale em aba nova". Aba já aberta tem processo
# já lançado; trocar o shell não relança nada, e o aviso diz isso.
[shell]
# Vazio = detecta automaticamente:
#   Linux    $SHELL -> /bin/sh
#   macOS    $SHELL -> /bin/zsh
#   Windows  pwsh.exe -> powershell.exe -> cmd.exe
program = ""
args = []

# Variáveis injetadas no ambiente de cada shell.
#
# O app já define, antes desta seção (ADR-0012):
#   TERM=xterm-256color        capacidades, via terminfo
#   COLORTERM=truecolor        24 bits, que o terminfo do xterm não descreve
#   TERM_PROGRAM=porecatu      identificação do app
#   TERM_PROGRAM_VERSION=...   versão do binário
#
# Chaves declaradas aqui têm precedência sobre essas — a config do usuário é
# soberana. Sobrescrever TERM é escape para caso específico, não rotina:
# valor inválido faz o ncurses recusar-se a abrir.
#
# TERM_PROGRAM é o gancho para emitir OSC 7 condicionalmente no seu shell,
# que é o que faz a restauração de diretório funcionar. Ver PRD-003 RF-3.1.
# Classe de recarga: [C], como [shell] -- vale em aba nova.
[shell.env]
# EDITOR = "vim"


##############################################################################
# APARÊNCIA DO CHROME — PRD-004
##############################################################################

# Classe de recarga: [A], com quatro exceções marcadas nas próprias linhas.
[appearance.window]
padding_x = 0              # [B] muda a área útil, logo colunas e linhas  RF-4.1
padding_y = 0              # [B] idem
# [C] "vale na próxima janela": atributo de superfície decidido na criação.
opacity = 1.0              # 0.0 a 1.0; opacidade da janela inteira      RF-4.1
background = "#15181d"     # corpo da janela, atrás das barras
border = "#2a2f38"
corner_radius = 8
# Decorações do sistema. Fora do macOS o default é `false` (ADR-0027): a
# barra de abas assume drag region, botões de janela e resize por borda,
# para que nem a borda da janela escape da paleta do design. No macOS o
# default é `true` -- a decoração nativa continua, com o semáforo, e a
# trilha reserva espaço à esquerda dele.
#
# A faixa de identidade do mockup (logo, nome do app, título da aba ativa)
# segue [v2]: os controles saíram dela para a barra de abas existente, sem
# empilhar uma segunda barra. Ver ADR-0027 e a seção 2.2.1 da espec.
# [C] "reinicie o app": winit não recria o frame do SO sem recriar a janela.
decorations = false        # macOS: true                                 RF-4.1
# [C] "reinicie o app": move a barra de aresta, e com ela a origem de todo
# hit-testing e o recorte da trilha. Aplicável em teoria; fora do v1 por
# custo de verificação, não por impossibilidade.
tab_bar_position = "top"   # "top" | "bottom"                            RF-4.1

# Animação de interface. O v1 tem duas, e as duas são explicativas, não
# decorativas: a reordenação das abas ao formar grupo (RF-2.5) e o colapso
# da pílula. `false` aplica o estado final no primeiro frame -- as abas
# ficam contíguas do mesmo jeito, só não se vê o caminho.
#
# Existe por acessibilidade (movimento na tela é gatilho), por máquina
# remota (RDP/VNC gastam banda com isso) e porque nada de aparência fica
# fora do alcance desta config. Ver ADR-0022.
animations = true
# Duração do `reflow` da seção 1.10 da especificação visual. Interpolação
# linear, sem curva de easing. São DUAS durações, uma por consumidor do
# relógio (ADR-0022): formar/arrastar grupo e colapsar/expandir. O binário
# usa 180 e 150 -- valores calibrados em tela, não um só arredondado.
animation_reflow_ms = 180          # formar grupo e arrastar grupo (RF-2.5)
animation_collapse_ms = 150        # colapso e expansão de grupo (RF-2.13)


# Controles de janela e resize, quando `decorations = false` (ADR-0027,
# seção 2.2.1 da espec. visual). Nenhum destes tem RF próprio em PRD-004: o
# ADR-0027 veio depois do PRD, e a emenda está registrada na seção 4.4.
# Classe de recarga: [A] -- mudam a largura da zona fixa, não a grade.
[appearance.window_controls]
button_width = 46             # largura de cada botão; altura = a da barra
gap = 6                       # respiro entre a zona de configurações e esta
hover_background = "#252a33"  # tom da seção 2.1, reaproveitado
close_hover_background = "#c4413f"
close_hover_foreground = "#ffffff"
# Espessura da zona de resize em cada borda da janela. Desliga sozinha com
# a janela maximizada.
resize_border = 6
# Espaço reservado à ESQUERDA da trilha para o semáforo nativo do macOS.
# Fora do macOS, zero. Valor de partida, não medido contra NSWindow real.
macos_traffic_light_inset = 78


# Classe de recarga: [A], exceto as três alturas marcadas abaixo: elas mudam
# `bar_height`, logo a área do terminal.
[appearance.tabs]
# --- dimensões ------------------------------------------------------- RF-4.3
# A altura da barra NÃO é livre: é derivada (`chrome::bar_height`) de
#   tab_height + wrapper_padding * 2 + trilha_padding * 2 = 34 + 6 + 12 = 52
# A chave `height` fica como o valor esperado dessa conta -- serve de
# verificação, não de entrada. O 42 do design pressupunha aba de 30 e
# trilha colada nas bordas; as duas coisas mudaram, a pedido do usuário.
height = 52                # [B] altura da barra, em px lógicos (derivada)
tab_height = 34            # [B] altura da aba DENTRO de um grupo
                           # aba solta: tab_height + wrapper_padding * 2 = 40
trilha_padding = 6         # [B] respiro entre a trilha e as bordas da barra,
                           # nos quatro lados; entra na conta de `height`
max_width = 260            # teto: a aba tem largura fixa (padding + 180px de
                           # rótulo + gap + botão de fechar = 229), saturada aqui
min_width = 229            # piso = a largura fixa: nada encolhe (ver abaixo)
padding_left = 10          # design usa padding assimétrico: 0 6px 0 10px
padding_right = 6          # menor à direita por causa do botão de fechar
gap = 4                    # espaço entre abas do mesmo grupo
corner_radius = 6          # 0 = abas retangulares                       RF-4.4
# Respiro horizontal DENTRO de cada botão de ícone (fechar da aba, os dois
# "+", caret da pílula, botão da zona fixa): eles ficam mais largos que
# altos, com o desenho ainda centrado no quadrado original. A altura não
# muda -- senão o botão de fechar deixaria de caber na aba.
icon_button_padding_x = 4
# Tamanho de EM dos ícones do chrome, não do desenho: a face Lucide avança
# 1 em e preenche ~0.6 dela, então um ✕ "de 10px" pedido como em de 10px sai
# com 5.9px de desenho e traço de 0.83px, que o antialiasing dilui até
# desaparecer. Ver ADR-0024 e a seção 1.1 da espec.
icon_em_size = 20
# LARGURA DA ABA É FIXA (RF-4.3, RF-4.5 emendados). `min_width` e
# `max_width` existem, mas hoje descrevem a mesma largura: o teto de 180px
# do rótulo virou também o piso. Largura por conteúdo refluía a trilha
# inteira a cada título novo -- trocar de aba, renomear ou abrir um
# programa que muda o título mexia na posição de todas as outras. Em
# overflow, nada cede: a trilha rola (seção 2.18 da espec.). Encolhimento
# por busca binária foi implementado na F2/F3 e descartado por custo (até
# 24 relayouts por frame, cada um remedindo texto sem cache); voltar a
# aceitar `min_width < max_width` exige cache de medição primeiro.

# --- fonte do título -------------------------------------------------- RF-4.10
font_family = "Iosevka Fixed" # unificada com o terminal (ADR-0026)
font_size = 13 # era 12.5, pedido do usuário; o nome da pílula usa o mesmo
               # tamanho, mas peso próprio -- ver [appearance.groups]

# --- elementos visíveis ------------------------------------- RF-4.11, RF-4.12
show_close_button = "always" # "always" | "hover" | "never"; design usa always
show_index = false           # número da aba antes do título
show_activity_indicator = true   # RF-1.20 — sem desenho aprovado ainda
show_bell_indicator = true       # RF-1.21 — sem desenho aprovado ainda
show_new_tab_button = true
show_profile_badge = true    # [v2] badge de perfil na aba   RF-4.23, PRD-007
# Oculta a barra inteira quando existe apenas uma aba.                   RF-4.2
hide_when_single_tab = false


# Classe de recarga: [A].
[appearance.tabs.colors]
# --- barra ------------------------------------------------------------ RF-4.7
bar_background = "#1b1f26"
# Separador na base da barra. NÃO é pintado com `tab_bar_position = "top"`:
# o traço de 1px virava uma linha contra o quadro do terminal, que o
# usuário pediu para eliminar. Continua governando a aresta oposta quando a
# barra vai para baixo. Ver seção 4.4 da espec.
bar_border = "#23272f"
# Alfa do fundo da aba, sobre a cápsula do grupo: 15% da cor do grupo passa
# por baixo de cada aba. Sobre a barra, fora de um grupo, o resultado é
# indistinguível do opaco.
background_alpha = 0.85

# --- estados da aba --------------------------------------------------- RF-4.6
# O design não define hover por cor: aplica filtro de brilho sobre o
# estado atual. Com 6 cores de grupo, cor de hover exigiria 12 tokens.
active_background = "#282e37"
active_foreground = "#eaeef3"
inactive_background = "#191d23"
inactive_foreground = "#98a0ab"
hover_brightness = 1.18       # multiplicador aplicado no hover da aba
close_button_foreground = "#e4e8ee"  # era #727a86; ver espec. seção 4.4
close_button_hover_background = "#39404b"
close_button_hover_foreground = "#e4e8ee"
# Rótulo da aba `Exited` (ADR-0017): o binário já desenhava este tom antes
# desta chave existir -- é o `#727a86` que `close_button_foreground` citava
# como o valor anterior à promoção acima, reaproveitado aqui como o "tom de
# inerte" que a espec. §2.5 continua descrevendo para este estado. Chave
# nova nesta etapa (F4 etapa 2): faltava procedência declarada para um
# valor que o binário já pintava (ADR-0028).
exited_foreground = "#727a86"

# --- bordas ----------------------------------------------------------- RF-4.7
# A aba ativa é distinguível por fundo, borda E cor de texto — nunca só
# por matiz.                                                            RF-4.21
active_border = "#39404b"
inactive_border = "#22262e"
# 2px em TODO estado: 1px do `#22262e` da inativa não se lê contra a
# cápsula de cor cheia. A espessura é a mesma de `selected_border_width`,
# abaixo -- não é número novo. Efeito colateral aceito: a
# aba selecionada deixa de se distinguir por espessura e passa a se
# distinguir só pela cor do token.
active_border_width = 2
inactive_border_width = 2
selected_border = "#5ed3bc"   # aba em seleção múltipla; sem desenho     RF-2.2
selected_border_width = 2

# --- indicadores ------------------------------------------------------ RF-4.8
# Sem desenho aprovado no canvas; ver especificacao-visual.md seção 4.2.
activity_indicator = "#86c56a"
bell_indicator = "#ef8a8a"

# --- campo de rename inline ------------------------------------------- RF-1.8
rename_background = "#0e1116"
rename_border = "#5ed3bc"
rename_foreground = "#e4e8ee"


# Geometria do campo de rename (espec. 2.5). Cores acima, em .colors.
# Classe de recarga: [A].
[appearance.tabs.rename]
width = 120                  # largura máxima; min(120, largura do rótulo)
height = 20                  # a espec. dá padding e fonte, não a altura
font_size = 12
padding_x = 5


# --- indicador de abas fora da vista --------------------------- RF-1.19
# Círculo com o chevron, ancorado por dentro de cada ponta da trilha, fora
# do recorte de rolagem. Era uma cápsula de 34x18 com chevron + contagem;
# virou círculo só com o chevron, a pedido do usuário (seção 4.4).
# Classe de recarga: [A].
[appearance.tabs.overflow]
indicator_size = 18          # largura = altura; o raio é a metade
indicator_background = "#12151a"
edge_inset = 4               # recuo por dentro de cada ponta da trilha
scroll_step = 90             # px por notch da roda e por clique no indicador


# Classe de recarga: [A] -- inclusive `wrapper_padding`, que muda a altura da
# aba solta mas não a da barra (`bar_height` sai da aba agrupada).
[appearance.groups]
# --- pílula do grupo -------------------------------------------------- RF-4.13
label_padding_left = 10       # era 8; +2px, pedido do usuário
label_padding_right = 9
# Mesmo TAMANHO do rótulo da aba (13): meio pixel de diferença lado a lado
# lê como fonte trocada, não como hierarquia. O PESO diverge -- 500
# (`Medium`), pedido do usuário para o rótulo do grupo ler como bold.
label_font_size = 13.0
label_font_weight = 500       # 400 | 500 -- a face Fixed só embute os dois
label_corner_radius = 6
label_hover_brightness = 1.25 # ainda não desenhado; entra na F4
# Sem `label_background`/`label_foreground`/`label_border`, sem swatch.
# Pedido do usuário: a pílula inteira é pintada com a cor do grupo (a
# mesma cápsula do wrapper), sem borda e sem um quadrado de cor à parte --
# e nome/caret usam `count_background` (abaixo) pelo mesmo motivo do "+"
# do grupo: sobre a cor cheia, o claro perde contraste.
# Teto do nome do grupo (RF-2.12). O teto de 140 é o da aba (180) menos os
# 41px de cromo da seção 2.18: uma pílula não deve ficar mais larga que a
# aba que ela rotula. Nome além do teto trunca com reticências e aparece
# inteiro no tooltip. Sem piso: o nome nunca encolhe abaixo do teto -- a
# trilha inteira rola quando não cabe, em vez de ceder rótulo/nome antes
# disso (mudança de performance pós-F3, ver a nota de `tab_bar::fit_width`
# no código; a métrica de dez grupos do PRD-002 segue valendo, só que via
# rolagem em vez de encolhimento).
label_max_width = 140
# `count_background`: contador de abas no popover de destino e no
# indicador de overflow (a pílula da barra não tem mais contador nem
# swatch); também a cor de nome/caret da pílula e do "+" do grupo, sobre a
# cápsula cheia -- pedido do usuário, ver nota acima.
count_background = "#12151a"
count_foreground = "#7b838f"
count_corner_radius = 9
# Sem `caret_foreground`: o caret da pílula usa `count_background` (acima),
# não um tom próprio -- mesma nota.

# --- indicador -------------------------------------------- RF-4.14, RF-4.15
# NÃO HÁ CHAVE DE ESTILO. O indicador de grupo é a pílula (nome e caret na
# cor cheia do grupo) mais a cápsula atrás das abas, e é a única forma --
# ADR-0032, que supersede o ADR-0009 §5. O `indicator_style` que vivia aqui
# oferecia quatro estilos: "pill" (o que ficou), "underline" (desenhado na
# F3 e removido -- virou ruído depois que a cápsula passou a ser cor cheia)
# e "left-bar"/"outline", que nunca tiveram anatomia e saíram de escopo.
#
# `indicator_thickness` também saiu: o valor 2 que ela carregava governa a
# borda da aba, que tem chave própria em [appearance.tabs.colors]
# (`active_border_width`/`inactive_border_width`). Nada mudou de valor.
#
# A cápsula continua governada por `tint_strength` e pelos alfas de vidro,
# abaixo; a geometria da pílula, pelas chaves `label_*` acima.

# Espaço entre grupos, maior que o espaço entre abas do mesmo grupo.
# É o que torna a fronteira do grupo perceptível sem depender de cor.    RF-4.16
gap = 6
# Respiro entre a cápsula e o conteúdo. Só se aplica onde HÁ cápsula: num
# run implícito (abas soltas) ele não entra, senão abriria entre grupo e
# aba solta um vão maior -- e sem cor -- do que entre dois grupos. É também
# por causa dele que a aba solta é mais alta que a agrupada: solta, ela
# ocupa a caixa inteira do wrapper.
wrapper_padding = 3
wrapper_corner_radius = 8

# Quanto a cor do grupo tinge o fundo da cápsula: 0.0 a 1.0.             RF-4.19
# Default 1.0 -- COR CHEIA, não o tingimento de 0.07 que o design pedia:
# atrás do fundo das abas, 7% da cor não se via, e o indicador de grupo
# mais visível da barra não podia ser o menos legível dela. Pedido direto
# do usuário. A cápsula é desenhada também com o grupo COLAPSADO, abraçando
# a pílula sozinha -- é ela que diz de que cor o grupo é.
tint_strength = 1.0
# Efeito de vidro (pedido do usuário: "aparência chapada demais"). Sem
# primitiva de blur em porecatu-render, não há como turvar o que passa por
# trás -- só deixar passar menos dele. Alfa da cápsula e da pílula, mais um
# rim translúcido de 1px nas duas.
capsule_alpha = 0.85
label_alpha = 0.92
glass_border = "#ffffff"
glass_border_alpha = 0.16
glass_border_width = 1
# Sombra da cápsula e da aba solta (a aba dentro de um grupo fica só com a
# borda -- a cápsula carrega a sombra por ela). Três RoundedQuad pretos
# empilhados, já que não há primitiva de sombra: os spreads, alfas e
# offsets estão na seção 1.7 da espec. Liga e desliga; não são seis chaves.
shadow = true
border = "#262b34"            # borda de 1px da cápsula e da aba solta

# Grupo colapsado exibe a contagem de abas no rótulo.                    RF-4.17
# HOJE A PÍLULA NÃO TEM CONTADOR: ele saiu por pedido do usuário, expandido
# e colapsado (seção 2.4 da espec., registro na 4.4). A chave fica com
# default `true` porque é o comportamento que o requisito nomeia e o que
# volta a valer se o contador voltar; os tokens `count_*` continuam em uso
# noutros lugares -- ver a nota deles acima.
show_tab_count_when_collapsed = true

# Indicador agregado de atividade em grupo colapsado.                   RF-2.16
# Ponto de 6px antes do nome (o swatch que ficava à esquerda dele saiu),
# com as mesmas duas cores dos
# indicadores da aba ([appearance.tabs.colors]) e a mesma regra: um ponto
# só, campainha vence. Só aparece colapsado -- expandido, cada aba mostra
# o seu, e um agregado seria redundante. Não pisca, pela regra do ADR-0007.
# Ver seção 2.4 da especificação visual.
collapsed_indicator = true
collapsed_indicator_size = 6

# Paleta oferecida na troca manual de cor e usada para atribuir cor
# automaticamente a grupos novos, sem repetir na mesma janela.  RF-4.18, RF-2.4
# Seis cores, na ordem do design.
palette = [
  { name = "vermelho", color = "#ef8a8a" },
  { name = "amarelo",  color = "#e0b060" },
  { name = "ciano",    color = "#5ed3bc" },
  { name = "azul",     color = "#6fa8f5" },
  { name = "roxo",     color = "#a68cf0" },
  { name = "verde",    color = "#86c56a" },
]
# Cor usada por abas fora de qualquer grupo (grupo implícito, ADR-0006).
ungrouped_color = "#7b838f"

# Badge de perfil na aba: herda a cor do GRUPO, não a do perfil, para
# manter a barra legível pelo eixo principal de organização.   [v2] PRD-007
badge_tint_strength = 0.14


##############################################################################
# AVISO, DIÁLOGO E MENU DE CONTEXTO — PRD-010, ADR-0014
#
# Widgets próprios: nenhum diálogo nativo do sistema. Diálogo do SO bloqueia
# o event loop, não é tematizável por esta config e é diferente nas três
# plataformas. Os valores abaixo saem dos tokens de popover da especificação
# visual, seções 1.2, 1.3 e 1.5 — não há cor nova aqui.
##############################################################################

# Avisos do APP, empilhados no canto superior direito: erro de config com
# linha e chave (RF-4.21), chave desconhecida (RF-4.22), fonte ausente
# (RF-5.8), sessão corrompida (RF-3.14), schema mais novo (RF-3.16), convite
# de integração de shell (RF-3.1), fallback de GPU (ADR-0001).
#
# Fato de uma ABA só não vem para cá: vai como primeira linha no grid daquela
# aba — diretório inexistente (RF-3.10), código de saída (RF-1.3). Os dois
# canais estão definidos em RF-10.15.
# Classe de recarga: [A].
[appearance.notices]
background = "#1a1e25"
border = "#2e343e"
corner_radius = 8
foreground = "#dfe4ea"        # título
body_foreground = "#6b737e"   # corpo
font_size = 12.5              # título
body_font_size = 11.0
# Geometria da pilha e do cartão.
width = 320
padding_x = 12
padding_y = 11
gap = 8                       # entre avisos empilhados
stack_margin_top = 8          # da borda da área de conteúdo
stack_margin_right = 10
# Sem métrica natural de linha (mesma simplificação do line-height do
# terminal): valor de trabalho para separar título e corpo.
line_height = 16
close_button_size = 17        # o mesmo botão de fechar da aba
severity_bar_width = 2
# O CORPO É DE UMA LINHA, truncado com reticências. A espec. pedia três; o
# TextRun é sempre uma linha, e quebrar por palavra mudaria a altura do
# widget. Decidido não fazer (ADR-0028); registro na seção 4.4 da espec.
# Barra de severidade de 2px à esquerda.
error = "#ef8a8a"
warning = "#e0b060"
info = "#5ed3bc"
# Quantos convivem na tela; o quarto substitui o mais antigo.
max_visible = 3                # RF-10.16
# Erro e aviso persistem até dispensa. Só informação sai sozinha.
info_timeout_ms = 6000         # RF-10.16

# Diálogo modal de confirmação: fechar aba com processo (RF-1.6), fechar
# grupo com contagem (RF-2.23), fechar janela com mais de uma aba (ADR-0015).
#
# O foco inicial é sempre o CANCELAR, e isso não é configurável: diálogo
# destrutivo que confirma no Enter transforma distração em perda de
# trabalho.                                                          RF-10.18
# Classe de recarga: [A].
[appearance.dialog]
overlay = "#06070973"         # rgba(6,7,9,.45) da especificação visual
background = "#1a1e25"
border = "#2e343e"
corner_radius = 10
width = 380
padding = 16
gap = 14                      # entre título, corpo e a fila de botões
title_foreground = "#e6eaef"
title_font_size = 13.0
foreground = "#d7dce3"
font_size = 12.5              # corpo, de uma linha como no aviso
button_height = 30
button_gap = 8
button_padding_x = 12
button_corner_radius = 5
button_border = "#262b34"
destructive_foreground = "#e08585"
destructive_hover_background = "#2e2224"

# Menu de contexto de aba (RF-1.1, RF-1.2, RF-2.20) e de grupo (RF-2.22).
# Comportamento em RF-10.19 a RF-10.21.
# O menu do grupo e o editor de grupo leem a MESMA lista de ações — ver
# docs/reference/acoes.md.
# Classe de recarga: [A].
[appearance.context_menu]
background = "#1a1e25"
border = "#2e343e"
corner_radius = 8
width = 200                   # largura mínima
padding = 6
item_height = 28              # sem métrica natural de linha; ver notices
item_padding_x = 8
item_corner_radius = 5
item_hover_background = "#242a33"
separator = "#2a2f38"
foreground = "#d7dce3"
# Item indisponível fica esmaecido, nunca ausente: menu que muda de tamanho
# obriga a reaprender a posição dos itens a cada abertura.
disabled_foreground = "#5c646f"   # RF-10.20
destructive_foreground = "#e08585"
font_size = 12.5


# Tooltip do texto truncado. Origem: ADR-0019 — o ADR-0014 decidiu três
# widgets de chrome quando o v1 precisa de quatro (RF-1.10 título de aba,
# RF-2.12 nome de grupo, RF-9.3 caminho na barra de status [v2]).
# Anatomia na seção 2.20 da especificação visual.
# Classe de recarga: [A] -- `delay_ms` vale para o próximo hover.
[appearance.tooltip]
background = "#1a1e25"
border = "#2e343e"
# 6 e não 8: num retângulo de uma linha o raio de popover pesa.
corner_radius = 6
foreground = "#d7dce3"
font_size = 11.0
# Largura máxima; texto além disso trunca com reticências.
max_width = 320
padding_x = 8
padding_y = 7
# Folga entre o alvo e o tooltip, no eixo em que ele ancora.
gap = 6
# Atraso de hover parado antes de aparecer. Comportamento, não token de
# design — a seção 1.10 não define atraso.
delay_ms = 600
# Aparece SÓ quando o texto do alvo foi efetivamente truncado. Desligar aqui
# remove o tooltip por completo.
enabled = true


# Editor de grupo: o quinto widget de chrome (ADR-0023). Popover ancorado
# no grupo que está sendo editado, 8px abaixo da barra de abas -- não o
# `top: 76px` do canvas, que pressupõe a barra de título [v2]. Vira nos dois
# eixos para caber na janela, fecha em clique fora / Esc / perda de foco, e
# nunca coexiste com o menu de contexto.
#
# É a única superfície de escolha de cor do v1: a entrada por hexadecimal
# do RF-2.10 fica diferida, e quem quer outra cor a coloca na `palette`
# acima. Anatomia na seção 2.10 da especificação visual.
# Classe de recarga: [A].
[appearance.group_editor]
background = "#1a1e25"
border = "#2e343e"
corner_radius = 8
padding = 14
gap = 13
width = 286
# Folga entre a borda da barra de abas e o topo do popover -- o mesmo
# respiro da pilha de avisos.
offset_y = 8
# Rótulo de seção ("GRUPO", "COR"): 10px maiúsculas.
section_foreground = "#5c646f"
section_font_size = 10.0
# Campo de nome. Também usado inline sobre a pílula, no nascimento do grupo
# (RF-2.4): é o mesmo componente, renderizado em outro lugar.
input_background = "#0f1216"
input_border = "#333a45"
input_border_focus = "#5ed3bc"
input_corner_radius = 5
input_foreground = "#e4e8ee"
input_font_size = 13.0
input_height = 30             # a espec. dá padding e fonte, não a altura
input_padding_x = 9
# Espaço entre a legenda de seção ("GRUPO"/"COR") e o conteúdo abaixo.
section_caption_gap = 6
# Faixa de cores: seis quadrados, um por cor da `palette`.
swatch_size = 28
swatch_corner_radius = 6
swatch_gap = 8
swatch_border_width = 2
swatch_ring_selected = "#eef2f4"
# Halo do realce de foco por teclado / hover do swatch -- a espec. diz que
# os dois são o mesmo realce, mas não dá o tamanho dele.
swatch_highlight_pad = 3
# Lista de ações, com os mesmos tokens do menu de contexto.
item_foreground = "#d7dce3"
item_hover_background = "#242a33"
item_height = 28
divider = "#2a2f38"
divider_height = 1
# "Fechar grupo (N abas)" -- a ação destrutiva.
destructive_foreground = "#e08585"
destructive_hover_background = "#2e2224"


# Popover de grupo de destino do `tab.move_to_group` (RF-2.20, ADR-0023).
# Única lista ROLÁVEL do chrome: o tamanho dela é o número de grupos do
# usuário, ao contrário das listas de ação, cujo tamanho é conhecido em
# tempo de escrita. Cores e tipografia vêm de [appearance.context_menu] --
# é o mesmo popover, com linhas em vez de itens de ação.
# Classe de recarga: [A].
[appearance.move_to_group]
width = 200                   # = context_menu.width
row_height = 28               # = context_menu.item_height
row_padding_x = 8
# Teto de linhas visíveis de uma vez; acima disso a lista rola. Rola por
# realce de teclado e por clique -- não por roda do mouse (pendência
# registrada no roadmap).
max_visible_rows = 6
# Swatch da linha, menor que o da faixa de cores do editor.
swatch_size = 8
swatch_gap = 8


# Quadro arredondado em volta da grade do terminal -- pedido do usuário,
# sem origem no design (a seção 2.7 da espec. descrevia um retângulo pleno).
# A margem é o `trilha_padding` da barra e o padding é o `wrapper_padding`
# dobrado: nenhum número novo. Registro na seção 4.4 da espec.
# Classe de recarga: [B] -- as três primeiras mudam a área útil dentro do
# quadro, logo colunas e linhas.
[appearance.terminal_frame]
# Margem entre a borda da janela e o quadro, nos três lados que NÃO
# encostam na barra de abas. Em cima o quadro encosta na barra sem gap: um
# vão ali desenha uma linha entre a trilha e o terminal.
margin = 6
# Padding entre a borda do quadro e a grade, nos quatro lados.
padding = 6
corner_radius = 6
shadow = true                 # mesma sombra em camadas da cápsula


##############################################################################
# APARÊNCIA DO TERMINAL — PRD-005
##############################################################################

# Classe de recarga: [A].
[terminal]
# Nome de um tema definido em [[themes]]. Vazio = usa as cores de
# [terminal.colors] diretamente.                                RF-5.18, RF-5.19
theme = ""
# Opacidade do fundo do terminal, independente da opacidade da janela.   RF-5.15
background_opacity = 1.0


# Classe de recarga: [B] -- métrica de fonte decide a largura de célula, logo
# colunas e linhas. É o caso que o RF-5.28 nomeia.
[terminal.font]
family = "Iosevka Fixed"                                              # RF-5.1
# Cadeia de fallback, em ordem. Glyph ausente na família principal é
# procurado aqui antes de virar retângulo vazio.                        RF-5.2
fallback = ["Symbols Nerd Font Mono", "Noto Color Emoji", "Noto Sans CJK"]
# Par de propósito: a Iosevka Fixed avança 0.5 em em todo glyph, então
# `size / 2 * scale` precisa cair em pixel inteiro para a célula não ser
# arredondada.                                                          RF-5.3
size = 14.0

# Variantes. Vazio = deriva da família principal.                       RF-5.4
bold_family = ""
italic_family = ""
bold_italic_family = ""
# Sintetiza negrito/itálico quando a variante não existe na fonte.
synthesize_bold = true
synthesize_italic = true

# Texto em negrito usa a versão brilhante da cor ANSI.                  RF-5.5
bold_is_bright = false

# Multiplicadores das métricas naturais da fonte.                       RF-5.6
line_height = 1.75
letter_spacing = 0.0

ligatures = false                                                     # RF-5.7

# Zoom por atalho vale para a aba ativa ou para todas.       RF-5.9, RF-5.10
zoom_scope = "all"         # "all" | "active"


# Classe de recarga: [A].
[terminal.cursor]
shape = "block"            # "block" | "beam" | "underline"             RF-5.22
width = 7                  # px lógicos quando shape = "beam" ou "block"
# No design, cursor e prompt assumem a cor do grupo da aba — é o que
# amarra o terminal ao grupo sem pintar o fundo.
follows_group_color = true
blink = false                                                        # RF-5.23
blink_interval_ms = 500
unfocused_hollow = true    # cursor vazado quando a janela perde foco   RF-5.24
# DECSCUSR emitido pelo programa tem precedência sobre `shape`.         RF-5.25


# Classe de recarga: [C] -- "vale em aba nova". Mudar a capacidade do
# histórico de um motor em execução descartaria linhas já roladas; a chave
# vale para as abas que nascerem depois da gravação.
[terminal.scrollback]
lines = 10000                                                        # RF-5.26
scroll_multiplier = 3      # linhas por passo da roda do mouse         RF-5.27
# Saída em segundo plano não arranca o usuário de onde ele estava lendo.
scroll_on_output = false                                            # RF-10.13
# Digitar volta ao final, que é onde o prompt está.
scroll_on_input = true                                              # RF-10.13
# Na tela alternativa (vim, htop, less) não existe scrollback. Com isto
# ligado, a roda do mouse vira setas — é o que faz `less` e `man` rolarem.
alternate_scroll = true                                             # RF-10.14


# ---------------------------------------------------------------------------
# SELEÇÃO COM MOUSE — PRD-010, ADR-0013
#
# Os gestos são fixos, não configuráveis: arraste seleciona caractere, duplo
# clique seleciona palavra, triplo clique seleciona a linha lógica, Alt+arraste
# seleciona retângulo.
#
# Quando o programa em execução pede o mouse (htop, fzf, vim), o evento vai
# para ele. SHIFT força a seleção local, sempre — é a válvula de escape, e por
# isso não é configurável. Convenção do xterm.
# ---------------------------------------------------------------------------
# Classe de recarga: [A] -- vale para a próxima seleção.
[terminal.selection]
# Selecionar já copia para o clipboard. Desligado por default: quem seleciona
# só para ler não espera perder o que tinha copiado.
copy_on_select = false                                               # RF-10.8
# Caracteres que delimitam "palavra" no duplo clique.                 RF-10.5
word_separators = " \t\n\"'`()[]{}<>,;:!?=&|"
# Seleção PRIMARY do X11/Wayland (colar com botão do meio) NÃO é implementada
# no v1 — limitação conhecida, não bug. Nome reservado.
# primary_selection = false                                          RF-10.9


# ---------------------------------------------------------------------------
# CLIPBOARD — PRD-010, ADR-0013
# ---------------------------------------------------------------------------
# Classe de recarga: [A].
[terminal.clipboard]
# OSC 52: o programa em execução mexendo no clipboard do sistema.
#
# ESCRITA permitida: é o que faz copiar de dentro de um tmux ou nvim rodando
# por SSH funcionar, onde o programa não alcança o clipboard local.
osc52_write = true                                                 # RF-10.10
# LEITURA negada. Ligar isto permite que qualquer processo — inclusive num
# host remoto comprometido — leia o que você copiou, senha de gerenciador de
# senhas inclusa. Você não teria como saber que foi lido. Ligue com essa
# consciência, ou não ligue.
osc52_read = false                                                 # RF-10.11
# Teto do payload de escrita, em bytes. Sem limite, saída não confiável
# despeja megabytes no seu clipboard.
osc52_max_bytes = 102400                                           # RF-10.10


# Classe de recarga: [A].
[terminal.colors]
# Chaves declaradas aqui têm precedência sobre as do tema selecionado,
# permitindo adotar um tema e ajustar uma cor sem copiar a paleta.      RF-5.19
foreground = "#c7ccd6"                                               # RF-5.12
background = "#0f1216"
cursor = "#5ed3bc"                                                   # RF-5.13
cursor_text = "#0f1216"
selection_background = "#2e6b62"                                     # RF-5.14
selection_foreground = "#eef2f4"
# Segunda metade do prompt (caminho), quando o shell emite OSC 7.
prompt_secondary = "#6b737e"

# As 16 cores ANSI derivam das seis cores semânticas que o design usa
# na saída de terminal (ok/warn/error/accent/dim/padrão), estendidas
# para cobrir a paleta completa. Derivação declarada em
# docs/design/especificacao-visual.md, seção 1.9.
[terminal.colors.normal]                                             # RF-5.11
black   = "#3b434f"
red     = "#ef8a8a"
green   = "#86c56a"
yellow  = "#e0b060"
blue    = "#6fa8f5"
magenta = "#a68cf0"
cyan    = "#5ed3bc"
white   = "#c7ccd6"

[terminal.colors.bright]                                             # RF-5.11
black   = "#6f7783"
red     = "#f5a3a3"
green   = "#9bd482"
yellow  = "#ecc37c"
blue    = "#8dbcf8"
magenta = "#bda6f5"
cyan    = "#7fdfcc"
white   = "#eaeef3"

# Cores de 256 e true color emitidas pelos programas funcionam sempre e
# não são afetadas por esta paleta.                                    RF-5.17


##############################################################################
# TEMAS NOMEADOS — PRD-005 RF-5.18 a RF-5.21, ADR-0031
# Selecione com `theme = "<nome>"` em [terminal]. Cicle por atalho (RF-5.21).
#
# ESCOPO: UM TEMA DECLARA COR, E SÓ COR
#   Cor de terminal E cor de chrome -- um tema claro com a barra de abas
#   escura é um produto quebrado. Nunca fonte, dimensão, raio, espaçamento
#   ou tempo: com a fronteira em cor, `theme.cycle` é sempre recarga de
#   classe [A]. Um tema que mudasse `tab_height` refluiria a barra e
#   redimensionaria todos os PTYs a cada atalho -- classe [B] por atalho, o
#   que ninguém quer de uma troca de tema. Quem quer trocar fonte junto com
#   cor edita o arquivo; é mudança que se faz uma vez.
#   Chave fora desse escopo dentro de um tema é aviso de chave desconhecida.
#
# MERGE POR FOLHA, TRÊS NÍVEIS DE PRECEDÊNCIA                       RF-5.19
#   chave declarada FORA do tema  >  chave do tema ativo  >  default
#   Merge parcial e por folha: um tema que declara só `background` muda só
#   o fundo do terminal, e o resto cai no default. Não há tema "completo",
#   e um tema de uma chave é válido.
#   EXCEÇÃO: `palette` (cores de grupo) é SUBSTITUÍDA INTEIRA, nunca
#   mesclada por índice -- a posição na lista tem significado (é a ordem de
#   atribuição automática, ADR-0020 §5), e mesclar produziria uma paleta que
#   ninguém escolheu.
#   Consequência a lembrar: cor declarada fora do tema RESISTE à troca de
#   tema. É o que o RF-5.19 promete; o app avisa quando isso acontece.
#
# CICLO (`theme.cycle`, RF-5.21)
#   Anda na ORDEM DE DECLARAÇÃO deste arquivo -- não alfabética: a ordem do
#   arquivo é a que o usuário controla sem renomear nada. O estado SEM TEMA
#   (`theme = ""`, tudo nos defaults, que são os valores do design) é o
#   primeiro do ciclo e participa dele: sem isso, adotar um tema seria via
#   de mão única. Sem nenhum [[themes]] declarado, ciclar não faz nada.
#   Ciclar NÃO ESCREVE no arquivo (mesma regra do zoom, RF-5.9): vale para a
#   sessão. Uma recarga preserva o tema ciclado enquanto ele existir; se ele
#   desaparecer do arquivo, a sessão volta ao `theme` declarado e avisa.
#   Persistir o tema de sessão é F5.
#   O ciclo é do PROCESSO, não da janela: duas janelas compartilham o mesmo
#   Config, então ciclar numa muda as duas.
#
# Nome desconhecido em `theme` é AVISO (cai nos defaults, lista os nomes
# disponíveis). Nome DUPLICADO entre dois [[themes]] é ERRO: não há como o
# usuário saber qual dos dois vale.
#
# Classe de recarga: [A].
##############################################################################

[[themes]]
name = "catppuccin-mocha"
# Cores de CHROME, para demonstrar o escopo do ADR-0031: um tema pode
# retematizar a barra de abas junto com o terminal. Os nomes são os mesmos
# das seções de aparência -- aqui, [appearance.tabs.colors].
bar_background = "#181825"
tab_active_background = "#313244"
tab_inactive_background = "#1e1e2e"
tab_active_foreground = "#cdd6f4"
tab_inactive_foreground = "#a6adc8"
# Cores de TERMINAL.
foreground = "#cdd6f4"
background = "#1e1e2e"
cursor = "#f5e0dc"
cursor_text = "#1e1e2e"
selection_background = "#585b70"
selection_foreground = "#cdd6f4"

[themes.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[themes.bright]
black   = "#585b70"
red     = "#f37799"
green   = "#89d88b"
yellow  = "#ebd391"
blue    = "#74a8fc"
magenta = "#f2aede"
cyan    = "#6bd7ca"
white   = "#a6adc8"


[[themes]]
name = "gruvbox-dark"
foreground = "#ebdbb2"
background = "#282828"
cursor = "#ebdbb2"
cursor_text = "#282828"
selection_background = "#504945"
selection_foreground = "#ebdbb2"

[themes.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[themes.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"


##############################################################################
# KEYBINDINGS — ADR-0008 (semântica) e ADR-0029 (gramática)
#
# Precedência: modo de captura -> keybind de app -> terminal.
# Um binding que casa NUNCA cai para o terminal.
# Ação "none" remove o binding e devolve a tecla ao terminal.
# Nenhum default usa Ctrl+<letra> sozinho: esse espaço é do terminal.
#
# O conjunto de ações é FECHADO: ação desconhecida é erro de config, com
# sugestão do nome mais próximo. A lista completa, com a origem de cada uma,
# está em docs/reference/acoes.md.
#
# GRAMÁTICA DA CHAVE (ADR-0029)
#   <modificador>* <tecla>, separados por "+", tudo em MINÚSCULAS.
#   Modificadores: ctrl, shift, alt, cmd.
#     `cmd` é o modificador de macOS -- não `super`, não `meta`: é o nome
#     escrito na tecla física. Fora do macOS ele casa a tecla Super; nenhum
#     default o usa lá.
#   A ORDEM É LIVRE: "shift+ctrl+t" e "ctrl+shift+t" são o MESMO binding, e
#   declarar os dois é erro de binding duplicado, citando as duas linhas.
#   A tecla é a LÓGICA, com o layout do usuário já aplicado -- é o que faz
#   "ctrl+shift+comma" funcionar num ABNT2 sem descobrir onde a vírgula
#   mora fisicamente. IME e teclas mortas passam direto, sem consultar
#   este mapa.
#
#   Teclas nomeadas por palavra (símbolo seria ambíguo em TOML ou dependeria
#   de layout):
#     equals  minus  comma  period  slash  backslash  semicolon  quote
#     bracketleft  bracketright  backtick  space  tab  enter  escape
#     backspace  delete  insert  home  end  pageup  pagedown
#     up  down  left  right  f1 .. f24
#   Letras e dígitos são o próprio caractere: "t", "1".
#
# ERRO NÃO DEIXA O APP SEM TECLA (ADR-0029 §4)
#   Chave malformada, tecla desconhecida ou ação desconhecida invalidam
#   AQUELA LINHA: ela é descartada, o default embutido permanece, e o aviso
#   cita linha, chave e a sugestão. É mais fino que a regra geral do
#   ADR-0003 (que descartaria a config inteira) de propósito: um erro de
#   digitação numa tecla não deve reverter uma mudança de cor feita na
#   mesma gravação, e um mapa vazio deixaria o usuário sem Ctrl+Shift+C.
#   Trocar bindings durante um modo de captura (rename inline, editor de
#   grupo, diálogo) não afeta a captura em curso: ela termina com o mapa
#   que tinha ao abrir.
#
# DEFAULTS POR PLATAFORMA, NUM ARQUIVO SÓ
#   [keybindings] é a tabela comum; [keybindings.windows],
#   [keybindings.linux] e [keybindings.macos] sobrescrevem por plataforma.
#   Resolução: defaults embutidos da plataforma atual -> [keybindings] ->
#   tabela da plataforma atual. Um binding definido na tabela comum e na da
#   plataforma NÃO é duplicado: é override, que é o ponto -- um dotfile
#   sincronizado entre máquinas fica com a seção comum e o desvio de cada
#   SO explícito.
#
# Classe de recarga: [A] -- o mapa novo vale imediatamente, com a ressalva
# do modo de captura acima.
##############################################################################

[keybindings]
"ctrl+shift+t"        = "tab.new"
"ctrl+shift+w"        = "tab.close"
"ctrl+tab"            = "tab.next"
"ctrl+shift+tab"      = "tab.prev"
"alt+1"               = "tab.goto_1"
"alt+9"               = "tab.goto_9"
"ctrl+shift+r"        = "tab.rename"
"ctrl+shift+left"     = "tab.move_left"
"ctrl+shift+right"    = "tab.move_right"

"ctrl+shift+g"        = "group.create"
"ctrl+shift+u"        = "group.dissolve"
"ctrl+shift+e"        = "group.rename"
"ctrl+shift+k"        = "group.toggle_collapse"
"ctrl+shift+pagedown" = "group.next"
"ctrl+shift+pageup"   = "group.prev"

# group.new_tab e group.close_all são vinculáveis e ficam SEM default, de
# propósito: atalho para a ação mais destrutiva da interface (RF-2.23) é
# risco desproporcional, e `tab.new` já cria aba no grupo da aba ativa.
# Quem quiser, vincula:
# "ctrl+shift+insert" = "group.new_tab"

# Janelas. Cada janela tem seu próprio conjunto de abas e grupos.  RF-10.22
"ctrl+shift+n"        = "window.new"
"ctrl+shift+q"        = "window.close"   # não é ctrl+shift+w: essa é tab.close
# app.quit não tem default em Windows e Linux — fechar a última janela já
# encerra o app (RF-1.4). No macOS o default é Cmd+Q, por convenção.

"ctrl+shift+c"        = "clipboard.copy"
"ctrl+shift+v"        = "clipboard.paste"

# Rolagem do scrollback. Shift de novo como o modificador que fala com o
# emulador em vez do programa. Nada age na tela alternativa.       RF-10.12
"shift+pageup"        = "scrollback.page_up"
"shift+pagedown"      = "scrollback.page_down"
"shift+home"          = "scrollback.to_top"
"shift+end"           = "scrollback.to_bottom"

"ctrl+equals"         = "font.increase"
"ctrl+minus"          = "font.decrease"
"ctrl+0"              = "font.reset"
"ctrl+shift+y"        = "theme.cycle"      # RF-5.21; movido de ctrl+shift+p
                                           # para liberar a paleta. ADR-0009.

"ctrl+shift+comma"    = "config.reload"

# [v2] O design abre a paleta de comandos com Ctrl+Shift+P. PRD-008. Ação
# fora do catálogo fechado da F4 (docs/reference/acoes.md) -- nome
# reservado, sem default embutido, comentada como as duas de F6 abaixo.
# "ctrl+shift+p"      = "command.palette"

# Busca no scrollback e "selecionar tudo" são da F6 do roadmap. As ações
# existem no catálogo; os defaults são decididos quando a fase começar.
# "ctrl+shift+f" = "search.open"
# "ctrl+shift+a" = "selection.select_all"

# --- defaults de macOS ---------------------------------- ADR-0008, ADR-0029
# A tabela do ADR-0008 define Cmd para todas as ações de app; nada disso
# responde no Mac até o parser existir. Estão aqui no formato que ele lê.
# `cmd+shift+g` para desagrupar (e não `cmd+u`) segue a tabela do ADR-0008;
# `ctrl+tab` é a única exceção ao padrão, e é igual nas três plataformas.
[keybindings.macos]
"cmd+t"               = "tab.new"
"cmd+w"               = "tab.close"
"ctrl+tab"            = "tab.next"
"ctrl+shift+tab"      = "tab.prev"
"cmd+1"               = "tab.goto_1"
"cmd+9"               = "tab.goto_9"
"cmd+r"               = "tab.rename"
"cmd+shift+left"      = "tab.move_left"
"cmd+shift+right"     = "tab.move_right"
"cmd+g"               = "group.create"
"cmd+shift+g"         = "group.dissolve"
"cmd+e"               = "group.rename"
"cmd+k"               = "group.toggle_collapse"
"cmd+alt+right"       = "group.next"
"cmd+alt+left"        = "group.prev"
"cmd+n"               = "window.new"
"cmd+shift+w"         = "window.close"
"cmd+c"               = "clipboard.copy"
"cmd+v"               = "clipboard.paste"
"shift+pageup"        = "scrollback.page_up"
"shift+pagedown"      = "scrollback.page_down"
"shift+home"          = "scrollback.to_top"
"shift+end"           = "scrollback.to_bottom"
"cmd+equals"          = "font.increase"
"cmd+minus"           = "font.decrease"
"cmd+0"               = "font.reset"
"cmd+shift+y"         = "theme.cycle"
"cmd+comma"           = "config.reload"
"cmd+q"               = "app.quit"     # convenção de plataforma; RF-1.4
# "cmd+shift+p"       = "command.palette"   # [v2], fora do catálogo -- ver nota acima

# As duas tabelas abaixo existem pela mesma razão e ficam vazias por
# default -- os defaults de Windows e Linux são os da tabela comum acima.
# Elas são o lugar de um desvio por SO num dotfile compartilhado.
# [keybindings.windows]
# [keybindings.linux]

# Ações que aceitam argumento (group.set_color, tab.move_to_group) não são
# vinculáveis a tecla: são invocadas por menu, onde o alvo é implícito. As
# duas abrem uma superfície de escolha -- o editor de grupo e o popover de
# grupo de destino -- em vez de executar direto. Ver ADR-0023.
#
# Por tecla, as ações de grupo operam sobre o grupo da ABA ATIVA; por menu
# ou pelo editor, sobre o grupo clicado. Ver docs/reference/acoes.md.

# Libera uma tecla para o terminal:
# "ctrl+shift+k" = "none"


##############################################################################
# SESSÃO — PRD-003
##############################################################################

# Classe de recarga: [C] -- "reinicie o app". Não há chave de caminho: trocar o
# destino com sessão em memória pediria migração de arquivo. Para testes existe
# a variável PORECATU_SESSION (ADR-0036), que não é contrato público.
# Tema e zoom de sessão são persistidos junto (ADR-0031, ADR-0036) e não têm
# chave própria -- `enabled = false` desliga tudo de uma vez.
[session]
enabled = true                    # false = sempre abre com uma aba limpa  RF-3.6
# Atraso do agrupamento de gravações. Fechar 10 abas gera 1 escrita.       RF-3.3
save_debounce_ms = 2000
# Só a aba ativa de cada janela inicia o shell no start; as demais
# iniciam ao serem focadas.                                               RF-3.8
lazy_restore = true
restore_window_geometry = true                                          # RF-3.11
# Oferece uma vez o trecho de integração de shell quando OSC 7 não é
# detectado. No Windows, sem OSC 7 o diretório NÃO é restaurado.          RF-3.1
suggest_shell_integration = true
