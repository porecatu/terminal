# Configuração do Porecatu
#
# Onde fica este arquivo:
#   Windows  %APPDATA%\porecatu\porecatu.toml
#   Linux    ~/.config/porecatu/porecatu.toml
#   macOS    ~/.config/porecatu/porecatu.toml
#
# Tudo aqui é opcional: apague uma linha e o Porecatu usa o valor padrão
# (o que está escrito neste arquivo). A maior parte das opções também pode
# ser mudada em Configurações (Ctrl+Shift+O), sem abrir este arquivo.
#
# Salvou, aplicou: o app relê o arquivo sozinho. Algumas opções só valem
# numa aba ou janela nova, ou depois de reiniciar -- o comentário avisa.
# Se algo estiver errado, o app mostra um aviso e continua funcionando.
#
# Cores não ficam aqui: ficam nos temas, arquivos thm_<nome>.toml nesta
# mesma pasta. O Porecatu traz dois, thm_default.toml (escuro) e
# thm_default_light.toml (claro). Para criar o seu, copie um deles com
# outro nome e troque as cores.


# --- Geral ------------------------------------------------------------------
[general]
# Pergunta antes de fechar uma aba com um programa rodando (vim, servidor...).
confirm_close_with_process = true
# Pergunta antes de fechar uma janela com mais de uma aba.
confirm_close_window = true
# Pasta onde a primeira aba abre: "home" (sua pasta pessoal) ou um caminho.
startup_directory = "home"
# Idioma da interface: en_US, pt_BR, es_ES, fr_FR ou de_DE.
language = "en_US"


# --- Shell ------------------------------------------------------------------
# Vale nas abas abertas depois da mudança.
[shell]
# Programa que roda em cada aba. Vazio = escolhe sozinho
# (Windows: pwsh, depois powershell, depois cmd; Linux e macOS: o seu shell).
program = ""
# Argumentos passados a esse programa, por exemplo ["-l"].
args = []

# Variáveis de ambiente extras para cada aba.
[shell.env]
# EDITOR = "vim"


# --- Perfis de aba ----------------------------------------------------------
# Vale nas abas abertas depois da mudança.
[profiles]
# Perfil que o "+" abre. É o "id" de um perfil da lista abaixo.
# Vazio = o próprio [shell].
default = ""
# Procura shells instalados na primeira vez que o menu de perfis abre.
detect = true

# Um perfil por bloco. Tire o "#" das linhas para usar.
# [[profiles.list]]
# Nome interno: letras minúsculas, números, "-" e "_", até 32 caracteres.
# id = "wsl"
# Nome que aparece no menu.
# name = "Ubuntu 24.04"
# Texto curto na aba, de 1 a 4 caracteres.
# badge = "WSL"
# Programa e argumentos que rodam na aba.
# program = "wsl.exe"
# args = ["-d", "Ubuntu-24.04"]
# Pasta onde a aba abre. "~/" é a sua pasta pessoal. Vazio = como as outras abas.
# cwd = "~/projetos"
# Variáveis de ambiente extras, somadas às de [shell.env]. Este arquivo é
# texto puro: não guarde senha nem chave aqui.
# [profiles.list.env]
# EDITOR = "vim"


# --- Terminal ---------------------------------------------------------------
[terminal]
# Tema de cores: o nome do arquivo thm_<nome>.toml, sem "thm_" e sem ".toml".
theme = "default"
# Transparência do fundo do terminal, de 0.0 (invisível) a 1.0 (opaco).
# Para ver o que está atrás da janela, reinicie o app depois de mudar.
background_opacity = 1.0

# Imagem de fundo atrás de cada terminal (PNG ou JPEG). Tire o "#" das
# linhas para usar.
# [terminal.background_image]
# Caminho da imagem. Relativo a esta pasta, "~/" é a sua pasta pessoal.
# path = "fundo.png"
# "stretch" estica para caber, "tile" repete, "center" centraliza.
# mode = "stretch"
# Transparência da imagem, de 0.0 a 1.0.
# opacity = 1.0

# Efeito acrílico: a imagem de fundo da janela aparece desfocada através do
# terminal, tingida pela cor de fundo dele. Tire o "#" das linhas para usar.
# Só funciona com duas coisas ao mesmo tempo: a opacidade da janela em 1.0
# ([appearance.window] opacity) e uma imagem de fundo da janela
# ([appearance.window.background_image] path). Faltando uma delas, o app
# desenha sem o efeito e avisa qual falta. Com "background_opacity = 1.0" o
# fundo do terminal cobre o efeito: baixe esse valor para vê-lo.
# [terminal.acrylic]
# true liga o efeito.
# enabled = false
# Quanto desfocar, de 1 a 64 (em pixels). Valor fora disso é ajustado.
# blur = 24

[terminal.font]
# Fonte do terminal e das abas.
family = "Iosevka Fixed"
# Fontes usadas para símbolos que a principal não tem.
fallback = ["Symbols Nerd Font Mono", "Noto Color Emoji", "Noto Sans CJK"]
size = 14.0
# Fontes específicas para negrito e itálico. Vazio = a mesma de cima.
bold_family = ""
italic_family = ""
bold_italic_family = ""
# Imita negrito e itálico quando a fonte não tem essas versões.
synthesize_bold = true
synthesize_italic = true
# Texto em negrito usa a versão clara da cor.
bold_is_bright = false
line_height = 1.2
letter_spacing = 0.0
ligatures = false
# Ctrl+= e Ctrl+- mudam o tamanho da fonte: "all" em todas as abas,
# "active" só na aba atual.
zoom_scope = "all"

[terminal.cursor]
# "block" (bloco), "beam" (barra) ou "underline" (sublinhado).
shape = "block"
# Largura do cursor "beam", em pixels.
width = 7
# Cursor com a cor do grupo da aba.
follows_group_color = true
blink = false
blink_interval_ms = 500
# Cursor vazado quando a janela não está em foco.
unfocused_hollow = true

[terminal.scrollback]
lines = 10000          # linhas antigas guardadas para rolar para cima
# Linhas por passo da roda do mouse.
scroll_multiplier = 3
# Volta para o fim quando sai texto novo.
scroll_on_output = false
# Volta para o fim quando você digita.
scroll_on_input = true
# A roda do mouse rola dentro de programas de tela cheia (less, vim).
alternate_scroll = true

[terminal.selection]
# Selecionar já copia para a área de transferência.
copy_on_select = false
# Caracteres que separam palavras no clique duplo.
word_separators = " \t\n\"'`()[]{}<>,;:!?=&|"

[terminal.clipboard]
# Programas no terminal podem escrever na área de transferência.
osc52_write = true
# Programas no terminal podem ler a área de transferência (cuidado).
osc52_read = false
# Tamanho máximo, em bytes, do que um programa pode copiar.
osc52_max_bytes = 102400

[terminal.hyperlinks]
# Links que os programas mostram abrem com Ctrl+clique.
enabled = true


# --- Janela -----------------------------------------------------------------
[appearance.window]
# Transparência da janela inteira, de 0.0 a 1.0. Reinicie o app depois de
# mudar.
opacity = 1.0
# Animações ao agrupar, arrastar e recolher abas.
animations = true
animation_reflow_ms = 180
animation_collapse_ms = 150
# Moldura e botões do sistema operacional. Reinicie o app depois de mudar.
# No macOS o padrão é true.
decorations = false
# Ajuste fino; não precisa mexer.
padding_x = 0
padding_y = 0
corner_radius = 8

# Imagem de fundo da janela inteira (PNG ou JPEG), atrás das abas e dos
# terminais. Tire o "#" das linhas para usar.
# [appearance.window.background_image]
# path = "fundo.png"
# mode = "stretch"
# opacity = 1.0

[appearance.status_bar]
# Barra no rodapé com shell, pasta, grupo e branch do Git.
enabled = true
# Ajuste fino; não precisa mexer.
height = 26
padding_x = 12
gap = 16
font_size = 10.5


# --- Sessão -----------------------------------------------------------------
# Reinicie o app depois de mudar.
[session]
# Reabre as abas e janelas da última vez. false = sempre começa do zero.
enabled = true
# Espera, em milissegundos, antes de gravar a sessão.
save_debounce_ms = 2000
# true = só a aba visível abre o shell na hora; as outras quando você
# clicar nelas.
lazy_restore = false
# Reabre a janela no mesmo tamanho e lugar.
restore_window_geometry = true
# Sugere uma vez como fazer o shell informar a pasta atual, para que ela
# volte junto com a sessão.
suggest_shell_integration = true


# --- Arquivo de projeto (.porecatu) -------------------------------------------
# Um arquivo .porecatu na pasta de um projeto diz que comando rodar quando
# uma aba daquela pasta é reaberta pela sessão. Detalhes no guia do usuário.
# Reinicie o app depois de mudar.
[project_file]
enabled = true
# Pastas onde um .porecatu pode rodar (inclui as subpastas). Vazio por
# segurança: um projeto baixado da internet poderia rodar qualquer coisa.
# Liste só pastas com projetos seus. Exemplo: ["C:/Projetos", "~/work"]
trusted_paths = []


# --- Git --------------------------------------------------------------------
[git]
# De quantos em quantos segundos o app confere se há commits novos no
# servidor, para mostrar na barra de status. 0 desliga. Mínimo 30.
remote_poll_interval_secs = 300


# --- Painéis divididos ------------------------------------------------------
[panes]
# Tamanho mínimo de um painel, em colunas e linhas de texto.
min_columns = 20
min_rows = 5


# --- Atalhos de teclado -----------------------------------------------------
# Formato: "teclas" = "ação". Teclas em minúsculas, unidas por "+":
# ctrl, shift, alt, cmd e a tecla. Nomes de teclas especiais: equals, minus,
# comma, period, slash, space, tab, enter, escape, up, down, left, right,
# pageup, pagedown, home, end, f1 a f24...
# Para devolver uma tecla ao terminal, use a ação "none".
# Lista de ações: docs/reference/acoes.md no site do projeto.
[keybindings]
"ctrl+shift+t"        = "tab.new"
"ctrl+shift+w"        = "tab.close"
"ctrl+tab"            = "tab.next"
"ctrl+shift+tab"      = "tab.prev"
"alt+1"               = "tab.goto_1"
"alt+9"               = "tab.goto_9"
"ctrl+shift+r"        = "tab.rename"
"ctrl+shift+left"     = "tab.move_left"
"ctrl+shift+right"    = "tab.move_right"

"ctrl+shift+g"        = "group.create"
"ctrl+shift+u"        = "group.dissolve"
"ctrl+shift+e"        = "group.rename"
"ctrl+shift+k"        = "group.toggle_collapse"
"ctrl+shift+pagedown" = "group.next"
"ctrl+shift+pageup"   = "group.prev"

"ctrl+shift+n"        = "window.new"
"ctrl+shift+q"        = "window.close"
"f11"                 = "window.toggle_fullscreen"

"ctrl+shift+c"        = "clipboard.copy"
"ctrl+shift+v"        = "clipboard.paste"

"shift+pageup"        = "scrollback.page_up"
"shift+pagedown"      = "scrollback.page_down"
"shift+home"          = "scrollback.to_top"
"shift+end"           = "scrollback.to_bottom"

"ctrl+equals"         = "font.increase"
"ctrl+minus"          = "font.decrease"
"ctrl+0"              = "font.reset"
"ctrl+shift+y"        = "theme.cycle"

"ctrl+shift+comma"    = "config.reload"
"ctrl+shift+o"        = "settings.open"

"ctrl+shift+f"        = "search.open"
"f3"                  = "search.next"
"shift+f3"            = "search.prev"
"ctrl+shift+a"        = "selection.select_all"

"ctrl+shift+h"        = "pane.split_horizontal"
"ctrl+shift+d"        = "pane.split_vertical"
"alt+left"            = "pane.focus_left"
"alt+right"           = "pane.focus_right"
"alt+up"              = "pane.focus_up"
"alt+down"            = "pane.focus_down"

"ctrl+shift+s"        = "session.save_named"

# Ações sem atalho padrão, que você pode ligar a uma tecla:
# "ctrl+shift+insert" = "group.new_tab"
# "ctrl+shift+x"      = "pane.close"
# "ctrl+shift+l"      = "session.open_list"
# "ctrl+shift+m"      = "profile.open_menu"
# "ctrl+alt+1"        = "profile.new_tab_1"   # até profile.new_tab_9: o N-ésimo perfil declarado

# Atalhos do macOS.
[keybindings.macos]
"cmd+t"               = "tab.new"
"cmd+w"               = "tab.close"
"ctrl+tab"            = "tab.next"
"ctrl+shift+tab"      = "tab.prev"
"cmd+1"               = "tab.goto_1"
"cmd+9"               = "tab.goto_9"
"cmd+r"               = "tab.rename"
"cmd+shift+left"      = "tab.move_left"
"cmd+shift+right"     = "tab.move_right"
"cmd+g"               = "group.create"
"cmd+shift+g"         = "group.dissolve"
"cmd+e"               = "group.rename"
"cmd+k"               = "group.toggle_collapse"
"cmd+alt+right"       = "group.next"
"cmd+alt+left"        = "group.prev"
"cmd+n"               = "window.new"
"cmd+shift+w"         = "window.close"
"cmd+c"               = "clipboard.copy"
"cmd+v"               = "clipboard.paste"
"shift+pageup"        = "scrollback.page_up"
"shift+pagedown"      = "scrollback.page_down"
"shift+home"          = "scrollback.to_top"
"shift+end"           = "scrollback.to_bottom"
"cmd+equals"          = "font.increase"
"cmd+minus"           = "font.decrease"
"cmd+0"               = "font.reset"
"cmd+shift+y"         = "theme.cycle"
"cmd+comma"           = "settings.open"
"cmd+shift+comma"     = "config.reload"
"cmd+q"               = "app.quit"
"cmd+f"               = "search.open"
"f3"                  = "search.next"
"shift+f3"            = "search.prev"
"cmd+a"               = "selection.select_all"
"cmd+shift+h"         = "pane.split_horizontal"
"cmd+shift+d"         = "pane.split_vertical"
"cmd+shift+s"         = "session.save_named"

# Atalhos só do Windows ou só do Linux, se precisar:
# [keybindings.windows]
# [keybindings.linux]


