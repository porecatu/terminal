white   = "#ebdbb2"


##############################################################################
# KEYBINDINGS — ADR-0008
#
# Precedência: modo de captura -> keybind de app -> terminal.
# Um binding que casa NUNCA cai para o terminal.
# Ação "none" remove o binding e devolve a tecla ao terminal.
# Nenhum default usa Ctrl+<letra> sozinho: esse espaço é do terminal.
#
# As linhas abaixo mostram os defaults de Windows e Linux. No macOS os
# defaults usam Cmd — ver a tabela do ADR-0008.
#
# O conjunto de ações é FECHADO: ação desconhecida é erro de config, com
# sugestão do nome mais próximo. A lista completa, com a origem de cada uma,
# está em docs/reference/acoes.md.
##############################################################################

[keybindings]
"ctrl+shift+t"        = "tab.new"
"ctrl+shift+w"        = "tab.close"
"ctrl+tab"            = "tab.next"
"ctrl+shift+tab"      = "tab.prev"
"alt+1"               = "tab.goto_1"
"alt+9"               = "tab.goto_9"
"ctrl+shift+r"        = "tab.rename"
"ctrl+shift+left"     = "tab.move_left"
"ctrl+shift+right"    = "tab.move_right"

"ctrl+shift+g"        = "group.create"
"ctrl+shift+u"        = "group.dissolve"
"ctrl+shift+e"        = "group.rename"
"ctrl+shift+k"        = "group.toggle_collapse"
"ctrl+shift+pagedown" = "group.next"
"ctrl+shift+pageup"   = "group.prev"

# Janelas. Cada janela tem seu próprio conjunto de abas e grupos.  RF-10.22
"ctrl+shift+n"        = "window.new"
"ctrl+shift+q"        = "window.close"   # não é ctrl+shift+w: essa é tab.close
# app.quit não tem default em Windows e Linux — fechar a última janela já
# encerra o app (RF-1.4). No macOS o default é Cmd+Q, por convenção.

"ctrl+shift+c"        = "clipboard.copy"
"ctrl+shift+v"        = "clipboard.paste"

# Rolagem do scrollback. Shift de novo como o modificador que fala com o
# emulador em vez do programa. Nada age na tela alternativa.       RF-10.12
"shift+pageup"        = "scrollback.page_up"
"shift+pagedown"      = "scrollback.page_down"
"shift+home"          = "scrollback.to_top"
"shift+end"           = "scrollback.to_bottom"

"ctrl+equals"         = "font.increase"
"ctrl+minus"          = "font.decrease"
"ctrl+0"              = "font.reset"
"ctrl+shift+y"        = "theme.cycle"      # RF-5.21; movido de ctrl+shift+p
                                           # para liberar a paleta. ADR-0009.

"ctrl+shift+comma"    = "config.reload"

# [v2] O design abre a paleta de comandos com Ctrl+Shift+P. PRD-008.
"ctrl+shift+p"        = "command.palette"

# Busca no scrollback e "selecionar tudo" são da F6 do roadmap. As ações
# existem no catálogo; os defaults são decididos quando a fase começar.
# "ctrl+shift+f" = "search.open"
# "ctrl+shift+a" = "selection.select_all"

# Ações que aceitam argumento (group.set_color, tab.move_to_group) não são
# vinculáveis a tecla: são invocadas por menu, onde o alvo é implícito.

# Libera uma tecla para o terminal:
# "ctrl+shift+k" = "none"


##############################################################################
# SESSÃO — PRD-003
##############################################################################

[session]
enabled = true                    # false = sempre abre com uma aba limpa  RF-3.6
# Atraso do agrupamento de gravações. Fechar 10 abas gera 1 escrita.       RF-3.3
save_debounce_ms = 2000
# Só a aba ativa de cada janela inicia o shell no start; as demais
# iniciam ao serem focadas.                                               RF-3.8
lazy_restore = true
restore_window_geometry = true                                          # RF-3.11
# Oferece uma vez o trecho de integração de shell quando OSC 7 não é
# detectado. No Windows, sem OSC 7 o diretório NÃO é restaurado.          RF-3.1
suggest_shell_integration = true
