  #   directory: /
  #   schedule:
  #     interval: weekly
  #     day: monday
  #   open-pull-requests-limit: 5
  #   commit-message:
  #     prefix: chore
  #     include: scope
  #   ignore:
  #     - dependency-name: wgpu
  #     - dependency-name: alacritty_terminal
