name: ci

# Workflow de Rust, escrito por inteiro e DORMINDO até existir código.
#
# O job `detect` verifica se há Cargo.toml na raiz. Enquanto não houver — ou
# seja, durante toda a fase de documentação — a matriz é pulada e o badge fica
# verde. Quando a F0 do roadmap criar o workspace Cargo, a matriz liga sozinha,
# sem ninguém precisar lembrar de editar este arquivo.
#
# Os quatro comandos abaixo são o contrato definido em CLAUDE.md.

# Actions pinadas por SHA de commit, com a versão legível no comentário ao
# lado. Tag major é ponteiro móvel: pode ser reapontada para outro commit, e
# uma v7.1 muda comportamento sem passar por PR do Dependabot. É a mesma
# disciplina do ADR-0011, um nível abaixo. O Dependabot atualiza SHA e
# comentário juntos.
#
# `dtolnay/rust-toolchain` é pinado por SHA como as demais actions, mas isso
# só fixa o CÓDIGO da action. A versão do Rust instalada vem do input
# `toolchain:`, setado aqui para o mesmo valor do `channel` em
# rust-toolchain.toml (ADR-0011) — sem isso, o rustup detectaria o arquivo na
# primeira invocação de `cargo` e baixaria uma SEGUNDA toolchain no job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Segunda-feira 06:00 UTC: gatilho do job `canario` (ADR-0011). Os jobs
  # `detect` e `rust` também disparam, e isso é inofensivo — `detect` custa
  # segundos e a matriz roda o que rodaria em qualquer push.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Execução agendada não cancela: se um push acontecer junto, o canário
  # perderia a corrida e o sinal semanal sumiria sem ninguém notar.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  detect:
    name: Detectar workspace Cargo
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.check.outputs.has_cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml encontrado — a matriz Rust vai rodar."
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
            echo "Sem Cargo.toml: projeto ainda na fase de documentação."
            echo "A matriz Rust liga sozinha quando a F0 criar o workspace."
          fi

  # Sem `name:` explícito, o GitHub nomeia cada job da matriz como
  # "rust (ubuntu-latest)" etc. — que é exatamente o contexto a exigir no
  # branch protection quando a F0 ligar a matriz.
  rust:
    needs: detect
    if: needs.detect.outputs.has_cargo == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # winit, wgpu e cosmic-text precisam destas no Linux. Declaradas já
      # agora para que a F0 não trave num erro de linkagem obscuro.
      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Testes
        run: cargo test --workspace

  # Canário do ADR-0011. A toolchain é pinada no rust-toolchain.toml; este job
  # é o que impede o pin de apodrecer, rodando a mesma matriz contra `stable`
  # FORA do caminho de PR. Lint novo do clippy aparece aqui, num job que já se
  # sabe que pode falhar, em vez de derrubar o PR de outra pessoa.
  #
  # `continue-on-error` é o ponto todo: a falha é sinal, não bloqueio.
  #
  # Dorme junto com a matriz — mesmo `detect`, mesma condição.
  canario:
    name: Canário (stable flutuante)
    needs: detect
    if: >-
      needs.detect.outputs.has_cargo == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config

      # `toolchain: stable` explícito, ignorando o rust-toolchain.toml de
      # propósito: é exatamente a versão que o pin NÃO está usando que se
      # quer testar. Só o código da action é pinado por SHA.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: canario

      - name: Clippy na stable do dia
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Testes na stable do dia
        run: cargo test --workspace
