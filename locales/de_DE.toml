# de_DE.toml -- textos da interface do Porecatu em alemão da Alemanha.
#
# O formato está descrito em pt_BR.toml. Uma frase que falta aqui cai em
# en_US (ADR-0056, PRD-015). Para mudar uma frase sem mexer neste arquivo,
# crie `locales/de_DE.toml` ao lado do seu `porecatu.toml`.
#
# Terminologia: "Tab" (em pt_BR, "aba"), "Bereich" para painel dividido.

[tab_menu]
new = "Neuer Tab"
close = "Tab schließen"
move_to_group = "In Gruppe verschieben"

[terminal_menu]
copy = "Kopieren"
paste = "Einfügen"
select_all = "Alles auswählen"
search = "Suchen"
open_link = "Link öffnen"
copy_link = "Link kopieren"

[group_menu]
rename = "Umbenennen"
set_color = "Farbe ändern"
collapse = "Gruppe einklappen"
expand = "Gruppe ausklappen"
new_tab = "Neuer Tab in der Gruppe"
close = { one = "Gruppe schließen ({count} Tab)", other = "Gruppe schließen ({count} Tabs)" }
dissolve = "Gruppierung aufheben"

[group_editor]
section_group = "GRUPPE"
section_color = "FARBE"
default_name = "Neue Gruppe"

[move_to_group]
new_group = "Neue Gruppe"

