save_item = "Dieses Fenster speichern…"
empty_list = "keine gespeicherten Sitzungen"
name_placeholder = "Sitzungsname"

[search_bar]
invalid_pattern = "ungültiges Muster"
no_results = "keine Treffer"
alt_screen_counter = "{counter} (alternativer Bildschirm)"

[status_bar]
pane_count = { one = "{count} Bereich", other = "{count} Bereiche" }
commits_behind = { one = "{count} Commit zurück", other = "{count} Commits zurück" }
behind_ahead = "{behind} zurück, {ahead} voraus"

[color]
red = "Rot"
yellow = "Gelb"
cyan = "Cyan"
blue = "Blau"
purple = "Violett"
green = "Grün"

[dialog]
cancel = "Abbrechen"

[dialog.close_tab]
title = "Tab schließen?"
body = "In «{title}» läuft ein Programm im Vordergrund. Trotzdem schließen?"
confirm = "Tab schließen"

[dialog.close_pane]
title = "Bereich schließen?"
body = "In «{title}» läuft ein Programm im Vordergrund. Trotzdem schließen?"
confirm = "Bereich schließen"

[dialog.close_window]
title = "Fenster schließen?"
body_tabs = "In diesem Fenster ist mehr als ein Tab geöffnet."
body_program = "In diesem Fenster läuft ein Programm im Vordergrund."
confirm = "Fenster schließen"

[dialog.close_group]
title = "Gruppe schließen?"
body = { one = "Dadurch wird {count} Tab geschlossen.", other = "Dadurch werden {count} Tabs geschlossen." }
confirm = { one = "Gruppe schließen ({count} Tab)", other = "Gruppe schließen ({count} Tabs)" }

[dialog.delete_session]
title = "Gespeicherte Sitzung löschen?"
body = "Dadurch wird «{name}» endgültig entfernt."
confirm = "Löschen"

[dialog.overwrite_session]
title = "Sitzung «{name}» überschreiben?"
body = "Die unter diesem Namen gespeicherte Sitzung wird ersetzt."
confirm = "Überschreiben"

[note]
process_exited = "Prozess beendet (Code {code})"
cwd_missing = "Verzeichnis \"{path}\" existiert nicht mehr, Tab im Home-Verzeichnis geöffnet"
project_file_untrusted = "{name} in {dir} gefunden, aber dieses Verzeichnis ist nicht vertrauenswürdig.\nUm ihm zu vertrauen, füge in porecatu.toml hinzu:\n    [project_file]\n    trusted_paths = [\"{toml_value}\"]"
project_file_unreadable = "\"{path}\" konnte nicht gelesen werden: {reason}"

[note.shell_invite]
text = "Dieses Terminal hat noch keine Shell-Integration (OSC 7). {consequence}\n\n{body}\n\nMarkiere das Snippet oben mit der Maus, um es wie gewohnt zu kopieren.\n\nUm diesen Hinweis nicht mehr zu sehen, tippe \"{marker}\" und drücke die Eingabetaste (die Shell meldet vermutlich, dass der Befehl nicht existiert -- das ist in Ordnung, es ist nur das Signal zum Ausblenden)."
consequence_windows = "Ohne sie wird das Verzeichnis dieses Tabs beim erneuten Öffnen von Porecatu nicht wiederhergestellt."
consequence_other = "Ohne sie ist die Wiederherstellung des Verzeichnisses dieses Tabs ungenauer (es wird ein aufwendigerer Weg genutzt, um den Aufenthaltsort zu ermitteln)."
body_snippet = "Füge Folgendes in die Konfiguration deiner Shell ein:\n\n{snippet}"
body_cmd = "cmd.exe kann dieses Signal nicht zuverlässig senden -- verwende PowerShell, wenn dir die Wiederherstellung des Verzeichnisses wichtig ist."
body_generic = "Shell nicht erkannt, daher gibt es kein fertiges Snippet. OSC 7 ist die Sequenz, die die Shell bei jedem Verzeichniswechsel sendet -- siehe docs/reference/integracao-de-shell.md im Porecatu-Repository, um deine einzurichten."

