# Notas escritas no grid do terminal (canal 2 do ADR-0014). Os avisos da pilha
# estão em [notice.*].
[note]
process_exited = "process exited (code {code})"
cwd_missing = "directory \"{path}\" no longer exists, tab opened in home"
# {name} é o nome do arquivo de projeto; {toml_value} é o diretório já escrito
# como valor de TOML (barras normais).
project_file_untrusted = "{name} found in {dir}, but this directory is not trusted.\nTo trust it, add to porecatu.toml:\n    [project_file]\n    trusted_paths = [\"{toml_value}\"]"
project_file_unreadable = "could not read \"{path}\": {reason}"

# Convite de integração de shell (ADR-0039). Os trechos de código ficam em
# docs/reference/integracao-de-shell.md e não são texto de interface; o
# marcador de dispensa que o usuário digita também não é traduzido.
[note.shell_invite]
text = "This terminal does not have shell integration yet (OSC 7). {consequence}\n\n{body}\n\nSelect the snippet above with the mouse to copy it, the usual way.\n\nTo stop seeing this notice, type \"{marker}\" and press Enter (the shell will probably say the command does not exist -- that is fine, it is only the dismissal signal)."
consequence_windows = "Without it, this tab's directory will not be restored when you reopen Porecatu."
consequence_other = "Without it, restoring this tab's directory is less exact (it uses a costlier way to find out where you are)."
body_snippet = "Paste this into your shell's config:\n\n{snippet}"
body_cmd = "cmd.exe has no reliable way to emit this signal -- use PowerShell if restoring the directory matters to you."
body_generic = "Shell not recognized, so there is no ready-made snippet to suggest. OSC 7 is the sequence the shell emits on every directory change -- see docs/reference/integracao-de-shell.md in the Porecatu repository to set yours up."

