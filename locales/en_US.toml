# en_US.toml -- textos da interface do Porecatu em inglês americano.
#
# É o idioma padrão e a reserva de todos os outros: uma frase que falta num
# idioma cai aqui, e uma que falta aqui também aparece como o próprio
# identificador (ADR-0056, PRD-015). O formato está descrito em pt_BR.toml;
# em resumo:
# - o NOME DO ARQUIVO é o idioma (`en_US`); não há campo de idioma aqui dentro;
# - uma tabela por superfície, com no máximo dois níveis
#   (`[dialog.close_tab]`); a chave é a identidade da frase, nunca o texto;
# - `{nome}` é um marcador, preenchido pelo programa; `{{` e `}}` são chaves
#   literais;
# - plural é `{ one = "...", other = "..." }`: `one` para exatamente 1, `other`
#   para todo o resto;
# - caixa alta faz parte do texto (`GROUP`), escolha do tradutor;
# - a tabela `meta` é reservada e ignorada.
#
# Terminologia: "tab" (em pt_BR, "aba").
#
# Este é o arquivo instalado com o app. Para mudar uma frase sem mexer nele,
# crie `locales/en_US.toml` ao lado do seu `porecatu.toml` e escreva só as
# frases que quer trocar: as camadas se mesclam frase a frase.

