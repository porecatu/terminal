[notice.named_session_corrupt]
title = "Sessão nomeada corrompida"
body = "O arquivo foi preservado em \"{path}\"."

[notice.named_session_newer]
title = "Sessão nomeada de uma versão mais nova"
body = "O formato salvo (versão {found}) é mais novo que o suportado por esta versão do Porecatu (até {supported})."

[notice.named_session_unreadable]
title = "Não foi possível restaurar a sessão"
body = "O arquivo não pôde ser lido."

[notice.overwrite_blocked]
title = "Não é possível sobrescrever"
body = "«{name}» foi salva por uma versão mais nova do Porecatu."

[notice.save_failed]
title = "Não foi possível salvar a sessão"
window_not_found = "janela não encontrada"
