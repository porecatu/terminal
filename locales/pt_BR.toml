[notice.delete_failed]
title = "Não foi possível excluir a sessão"

[notice.software_rendering]
title = "Sem aceleração de GPU"
body = "Nenhum adapter com aceleração de hardware foi encontrado; desenhando por software (mais lento)."

[notice.font_not_found]
title = "Família de fonte não encontrada"
body = "\"{family}\" não está instalada; usando uma monoespaçada do sistema."

[notice.git_interval_adjusted]
title = "Intervalo de sincronização ajustado"
body = "\"{key}\" é menor que o piso de {floor}s; usando {floor}s."

[notice.git_missing]
title = "Git não encontrado"
body = "Sincronização com o remoto desligada nesta execução: o app não achou o executável \"git\"."

[notice.git_integration_ok]
title = "Integração concluída"
body = "A branch está em dia com o remoto."

# Quando o git recusa com uma mensagem, ela entra como chegou; as três frases
# abaixo cobrem quando não há mensagem nenhuma.
[notice.git_integration_failed]
title = "Falha ao integrar com o remoto"
missing = "o git não foi encontrado no sistema."
timed_out = "o git não respondeu a tempo."
no_detail = "o git recusou a integração sem detalhar o motivo."

# Avisos sobre o próprio idioma (ADR-0056 §8).
[notice.language_not_found]
title = "Idioma não encontrado"
body = "Não há arquivo para \"{language}\" (procurado em: {searched})."

[notice.language_invalid_name]
title = "Nome de idioma inválido"
body = "\"{value}\" não é um nome de idioma válido (exemplo: pt_BR)."

[notice.language_syntax]
title = "Erro no arquivo de idioma"
body = "{path}: {detail}"
body_at = "{path}, linha {line}, coluna {column}: {detail}"

[notice.language_unreadable]
title = "Arquivo de idioma ilegível"
body = "Não foi possível ler \"{path}\": {cause}"

[notice.language_missing_messages]
title = "Textos sem tradução"
body = { one = "{count} texto sem tradução em {locale}", other = "{count} textos sem tradução em {locale}" }

[notice.language_unknown_keys]
title = "Chaves desconhecidas no idioma"
body = { one = "{count} chave desconhecida em {path}", other = "{count} chaves desconhecidas em {path}" }
