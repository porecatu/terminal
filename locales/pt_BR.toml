io = "erro de E/S ao gravar sessão nomeada: {cause}"
newer_schema = "arquivo existente tem schema_version {found}, mais nova que {supported}; não sobrescrito"
empty_name = "nome de sessão vazio depois de aparado"

[notice.delete_failed]
title = "Não foi possível excluir a sessão"

[notice.software_rendering]
