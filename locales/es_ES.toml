# es_ES.toml -- textos da interface do Porecatu em espanhol da Espanha.
#
# O formato está descrito em pt_BR.toml. Uma frase que falta aqui cai em
# en_US (ADR-0056, PRD-015). Para mudar uma frase sem mexer neste arquivo,
# crie `locales/es_ES.toml` ao lado do seu `porecatu.toml`.
#
# Terminologia: "pestaña" (em pt_BR, "aba"), "panel" para painel dividido.

[tab_menu]
new = "Nueva pestaña"
close = "Cerrar pestaña"
move_to_group = "Mover al grupo"

[terminal_menu]
copy = "Copiar"
paste = "Pegar"
select_all = "Seleccionar todo"
search = "Buscar"
open_link = "Abrir enlace"
copy_link = "Copiar enlace"

[group_menu]
rename = "Renombrar"
set_color = "Cambiar color"
collapse = "Contraer grupo"
expand = "Expandir grupo"
new_tab = "Nueva pestaña en el grupo"
close = { one = "Cerrar grupo ({count} pestaña)", other = "Cerrar grupo ({count} pestañas)" }
dissolve = "Desagrupar"

[group_editor]
section_group = "GRUPO"
section_color = "COLOR"
default_name = "Nuevo grupo"

[move_to_group]
new_group = "Nuevo grupo"

[session_picker]
save_item = "Guardar esta ventana…"
empty_list = "no hay sesiones guardadas"
name_placeholder = "nombre de la sesión"

[search_bar]
invalid_pattern = "patrón no válido"
no_results = "sin resultados"
alt_screen_counter = "{counter} (pantalla alternativa)"

[status_bar]
pane_count = { one = "{count} panel", other = "{count} paneles" }
commits_behind = { one = "{count} commit por detrás", other = "{count} commits por detrás" }
behind_ahead = "{behind} por detrás, {ahead} por delante"

[color]
red = "Rojo"
yellow = "Amarillo"
cyan = "Cian"
blue = "Azul"
purple = "Morado"
green = "Verde"

[dialog]
cancel = "Cancelar"

[dialog.close_tab]
title = "¿Cerrar la pestaña?"
body = "«{title}» tiene un programa ejecutándose en primer plano. ¿Cerrar de todos modos?"
confirm = "Cerrar pestaña"

[dialog.close_pane]
title = "¿Cerrar el panel?"
body = "«{title}» tiene un programa ejecutándose en primer plano. ¿Cerrar de todos modos?"
confirm = "Cerrar panel"

[dialog.close_window]
title = "¿Cerrar la ventana?"
body_tabs = "Esta ventana tiene más de una pestaña abierta."
body_program = "Esta ventana tiene un programa ejecutándose en primer plano."
confirm = "Cerrar ventana"

[dialog.close_group]
title = "¿Cerrar el grupo?"
body = { one = "Esto cierra {count} pestaña.", other = "Esto cierra {count} pestañas." }
confirm = { one = "Cerrar grupo ({count} pestaña)", other = "Cerrar grupo ({count} pestañas)" }

[dialog.delete_session]
title = "¿Eliminar la sesión guardada?"
body = "Esto elimina de forma permanente «{name}»."
confirm = "Eliminar"

[dialog.overwrite_session]
title = "¿Sobrescribir la sesión «{name}»?"
body = "La sesión guardada con este nombre será reemplazada."
confirm = "Sobrescribir"

[note]
process_exited = "proceso terminado (código {code})"
cwd_missing = "el directorio \"{path}\" ya no existe, pestaña abierta en el directorio personal"
project_file_untrusted = "{name} encontrado en {dir}, pero este directorio no es de confianza.\nPara confiar en él, añade a porecatu.toml:\n    [project_file]\n    trusted_paths = [\"{toml_value}\"]"
project_file_unreadable = "no se pudo leer \"{path}\": {reason}"

[note.shell_invite]
text = "Este terminal aún no tiene integración con el shell (OSC 7). {consequence}\n\n{body}\n\nSelecciona el fragmento de arriba con el ratón para copiarlo, como de costumbre.\n\nPara dejar de ver este aviso, escribe \"{marker}\" y pulsa Intro (el shell probablemente dirá que el comando no existe -- no pasa nada, es solo la señal de descarte)."
consequence_windows = "Sin ella, el directorio de esta pestaña no se restaurará al volver a abrir Porecatu."
consequence_other = "Sin ella, la restauración del directorio de esta pestaña es menos exacta (usa un método más costoso para saber dónde estás)."
body_snippet = "Pega esto en la configuración de tu shell:\n\n{snippet}"
body_cmd = "cmd.exe no tiene una forma fiable de emitir esta señal -- usa PowerShell si te importa restaurar el directorio."
body_generic = "Shell no reconocido, así que no hay un fragmento listo que sugerir. OSC 7 es la secuencia que el shell emite en cada cambio de directorio -- consulta docs/reference/integracao-de-shell.md en el repositorio de Porecatu para configurar el tuyo."

