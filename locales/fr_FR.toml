# O formato está descrito em pt_BR.toml. Uma frase que falta aqui cai em
# en_US (ADR-0056, PRD-015). Para mudar uma frase sem mexer neste arquivo,
# crie `locales/fr_FR.toml` ao lado do seu `porecatu.toml`.
