# fr_FR.toml -- textos da interface do Porecatu em francês da França.
#
# O formato está descrito em pt_BR.toml. Uma frase que falta aqui cai em
# en_US (ADR-0056, PRD-015). Para mudar uma frase sem mexer neste arquivo,
# crie `locales/fr_FR.toml` ao lado do seu `porecatu.toml`.
#
# Terminologia: "onglet" (em pt_BR, "aba"), "volet" para painel dividido.

[tab_menu]
new = "Nouvel onglet"
close = "Fermer l'onglet"
move_to_group = "Déplacer vers le groupe"

[terminal_menu]
copy = "Copier"
paste = "Coller"
select_all = "Tout sélectionner"
search = "Rechercher"
open_link = "Ouvrir le lien"
copy_link = "Copier le lien"

[group_menu]
rename = "Renommer"
set_color = "Changer la couleur"
collapse = "Réduire le groupe"
expand = "Développer le groupe"
new_tab = "Nouvel onglet dans le groupe"
close = { one = "Fermer le groupe ({count} onglet)", other = "Fermer le groupe ({count} onglets)" }
dissolve = "Dissocier"

[group_editor]
section_group = "GROUPE"
section_color = "COULEUR"
default_name = "Nouveau groupe"

[move_to_group]
new_group = "Nouveau groupe"

[session_picker]
save_item = "Enregistrer cette fenêtre…"
empty_list = "aucune session enregistrée"
name_placeholder = "nom de la session"

[settings]
window_title = "Paramètres"

[search_bar]
invalid_pattern = "motif invalide"
no_results = "aucun résultat"
alt_screen_counter = "{counter} (écran alternatif)"

[status_bar]
pane_count = { one = "{count} volet", other = "{count} volets" }
commits_behind = { one = "{count} commit de retard", other = "{count} commits de retard" }
behind_ahead = "{behind} de retard, {ahead} d'avance"

[color]
red = "Rouge"
yellow = "Jaune"
cyan = "Cyan"
blue = "Bleu"
purple = "Violet"
green = "Vert"

[dialog]
cancel = "Annuler"

[dialog.close_tab]
title = "Fermer l'onglet ?"
body = "« {title} » exécute un programme au premier plan. Fermer quand même ?"
confirm = "Fermer l'onglet"

[dialog.close_pane]
title = "Fermer le volet ?"
body = "« {title} » exécute un programme au premier plan. Fermer quand même ?"
confirm = "Fermer le volet"

[dialog.close_window]
title = "Fermer la fenêtre ?"
body_tabs = "Cette fenêtre contient plusieurs onglets ouverts."
body_program = "Cette fenêtre exécute un programme au premier plan."
confirm = "Fermer la fenêtre"

[dialog.close_group]
title = "Fermer le groupe ?"
body = { one = "Cela ferme {count} onglet.", other = "Cela ferme {count} onglets." }
confirm = { one = "Fermer le groupe ({count} onglet)", other = "Fermer le groupe ({count} onglets)" }

[dialog.delete_session]
title = "Supprimer la session enregistrée ?"
body = "Cela supprime définitivement «{name}»."
confirm = "Supprimer"

[dialog.overwrite_session]
title = "Écraser la session «{name}» ?"
body = "La session enregistrée sous ce nom sera remplacée."
confirm = "Écraser"

[note]
process_exited = "processus terminé (code {code})"
cwd_missing = "le répertoire \"{path}\" n'existe plus, onglet ouvert dans le répertoire personnel"
project_file_untrusted = "{name} trouvé dans {dir}, mais ce répertoire n'est pas approuvé.\nPour l'approuver, ajoutez à porecatu.toml :\n    [project_file]\n    trusted_paths = [\"{toml_value}\"]"
project_file_unreadable = "impossible de lire \"{path}\" : {reason}"

[note.shell_invite]
text = "Ce terminal n'a pas encore l'intégration du shell (OSC 7). {consequence}\n\n{body}\n\nSélectionnez l'extrait ci-dessus à la souris pour le copier, comme d'habitude.\n\nPour ne plus voir cet avis, tapez \"{marker}\" puis Entrée (le shell dira probablement que la commande n'existe pas -- c'est normal, ce n'est que le signal de rejet)."
consequence_windows = "Sans elle, le répertoire de cet onglet ne sera pas restauré à la réouverture de Porecatu."
consequence_other = "Sans elle, la restauration du répertoire de cet onglet est moins précise (elle utilise un moyen plus coûteux pour savoir où vous êtes)."
body_snippet = "Collez ceci dans la configuration de votre shell :\n\n{snippet}"
body_cmd = "cmd.exe n'a aucun moyen fiable d'émettre ce signal -- utilisez PowerShell si la restauration du répertoire compte pour vous."
body_generic = "Shell non reconnu, donc aucun extrait prêt à proposer. OSC 7 est la séquence que le shell émet à chaque changement de répertoire -- consultez docs/reference/integracao-de-shell.md dans le dépôt de Porecatu pour configurer le vôtre."

